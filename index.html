<title>DSM - Aydın Jeoteknik</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#18171A; --surface:#242128; --surface2:#2C2A30; --border:#3C3940;
  --text:#F2F0EB; --text2:#A09C96; --dim:#6B6760;
  --green:#00B67A; --blue:#3764E8; --orange:#E8762A; --red:#E8403A;
  --nav-h:68px; --header-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;height:100vh;overflow:hidden;}
.app{display:flex;flex-direction:column;height:100dvh;}
.header{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex-shrink:0;}
.logo h1{font-size:1.6rem;font-weight:800;color:#fff;letter-spacing:-1.5px;}
.content{flex:1;overflow-y:auto;padding-bottom:calc(var(--nav-h)+20px);}
.bottom-nav{height:var(--nav-h);background:var(--surface);border-top:1px solid var(--border);display:flex;padding:6px 8px;gap:4px;position:fixed;bottom:0;width:100%;z-index:100;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;color:var(--dim);cursor:pointer;font-size:.6rem;font-weight:600;}
.nav-item.active{color:#fff;background:var(--surface2);border-radius:12px;}
.fab-btn{position:fixed;right:20px;bottom:calc(var(--nav-h) + 20px);width:60px;height:60px;border-radius:30px;background:var(--orange);color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:1.6rem;box-shadow:0 4px 15px rgba(0,0,0,0.5);z-index:99;cursor:pointer;}
/* Kartlar */
.greet-card{background:linear-gradient(135deg,#18171A,#2A2830);border-radius:20px;padding:16px;margin:14px;border:1px solid var(--border);}
.gs-row{display:flex;justify-content:space-between;margin-top:10px;}
.gs-val{font-size:1.4rem;font-weight:800;}
.last-proj-card{background:linear-gradient(135deg,#242128,#18171A);border-radius:20px;padding:16px;margin:14px;border:1px solid var(--blue);}
.stitle{font-size:.85rem;font-weight:700;margin:20px 14px 10px;display:flex;align-items:center;gap:8px;}
.stitle::after{content:'';flex:1;height:1px;background:var(--border);}
.fg{margin:0 14px 12px;display:flex;flex-direction:column;gap:5px;}
.fg label{font-size:.7rem;font-weight:600;color:var(--text2);}
.fg input, .fg select{background:var(--surface);border:1px solid var(--border);color:#fff;padding:12px;border-radius:12px;outline:none;}
.btn{margin:10px 14px;padding:14px;border-radius:12px;border:none;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;}
.dtable{margin:0 14px;background:var(--surface);border-radius:16px;border:1px solid var(--border);overflow:hidden;}
.drow{display:flex;align-items:center;padding:14px;border-bottom:1px solid var(--border);gap:10px;}
.drname{flex:1;font-weight:600;font-size:.85rem;}
.drname span{display:block;font-size:.65rem;color:var(--text2);}
.panel{display:none;} .panel.active{display:block;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:center;justify-content:center;padding:20px;}
.modal-bg.open{display:flex;}
.modal{background:var(--surface);border-radius:24px;width:100%;max-width:400px;padding:24px;}
.hbtn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:6px 10px;border-radius:8px;font-size:.7rem;cursor:pointer;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo" onclick="logoTap()"><h1>DS<span>M</span></h1></div>
    <div class="header-right" style="display:flex;gap:8px;">
      <button class="hbtn admin-only" onclick="exportData()" style="display:none;">Yedek</button>
      <button class="hbtn" id="lockBtn" onclick="openAuthModal()">🔒</button>
    </div>
  </div>

  <div class="content" id="mainContent">
    <div class="panel active" id="tab-dashboard">
      <div class="greet-card">
        <div style="font-weight:800;">DSM Takip Sistemi</div>
        <div class="gs-row">
          <div><div style="font-size:.6rem;color:var(--text2);">TAMAMLANAN</div><div class="gs-val" style="color:var(--green);" id="d-comp">0</div></div>
          <div><div style="font-size:.6rem;color:var(--text2);">HEDEF</div><div class="gs-val" style="color:var(--blue);" id="d-total">0</div></div>
          <div><div style="font-size:.6rem;color:var(--text2);">KALAN</div><div class="gs-val" style="color:var(--orange);" id="d-rem">0</div></div>
        </div>
      </div>
      <div id="d-last-proj"></div>
      <div class="stitle">TÜM PROJELER</div>
      <div id="d-proj-list"></div>
    </div>

    <div class="panel" id="tab-projects">
      <div class="stitle">YENİ PROJE EKLE</div>
      <div class="fg"><label>Firma Adı</label><input type="text" id="p-company"></div>
      <div class="fg"><label>Kuyu Sayısı</label><input type="number" id="p-wc" inputmode="numeric"></div>
      <div class="fg"><label>Kuyu Basi Cimento (kg)</label><input type="number" id="p-cpw" inputmode="numeric"></div>
      <div class="fg"><label>Tarih</label><input type="date" id="p-date"></div>
      <button class="btn" onclick="addProject()">+ Projeyi Kaydet</button>
      <div class="stitle">MEVCUT PROJELER</div>
      <div id="project-list-panel"></div>
    </div>

    <div class="panel" id="tab-daily">
      <div class="stitle">VERİ GİRİŞİ</div>
      <div class="fg"><label>Proje Seç</label><select id="d-project"></select></div>
      <div class="fg"><label>Tamamlanan Kuyu</label><input type="number" id="d-wells" inputmode="numeric"></div>
      <div class="fg"><label>Tarih</label><input type="date" id="d-wells-date"></div>
      <button class="btn" onclick="addDailyRecord()">Kaydı Tamamla</button>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('dashboard',this)">📊<span>Özet</span></button>
    <button class="nav-item admin-only" onclick="switchTab('projects',this)" style="display:none;">📁<span>Projeler</span></button>
    <button class="nav-item admin-only" onclick="switchTab('daily',this)" style="display:none;">✏️<span>Giriş</span></button>
  </div>
</div>

<button class="fab-btn admin-only" onclick="openQuickEntry()" style="display:none;">⚡</button>

<div class="modal-bg" id="authModal" onclick="if(event.target===this)closeAuthModal()">
  <div class="modal">
    <div style="text-align:center;font-weight:800;margin-bottom:15px;">YÖNETİCİ GİRİŞİ</div>
    <input type="password" id="authInput" placeholder="Şifre" style="width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:#fff;text-align:center;">
    <button class="btn" style="width:100%;margin:15px 0 0;" onclick="checkAuth()">Giriş</button>
  </div>
</div>

<script>
// VERI YONETIMI (LocalStorage + Firebase Yedek)
var projects = JSON.parse(localStorage.getItem('dsm_projects') || '[]');
var dailyRecords = JSON.parse(localStorage.getItem('dsm_records') || '[]');
var isAdmin = localStorage.getItem('dsm_admin') === '1';

// SAYFA YUKLENDIGINDE
document.addEventListener('DOMContentLoaded', function() {
  refreshAll();
  applyAdminUI();
});

function refreshAll() {
  localStorage.setItem('dsm_projects', JSON.stringify(projects));
  localStorage.setItem('dsm_records', JSON.stringify(dailyRecords));
  renderDashboard();
  renderProjectList();
  populateDropdown();
}

function switchTab(t, el) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('tab-' + t).classList.add('active');
  el.classList.add('active');
}

// PROJE EKLEME
function addProject() {
  const comp = document.getElementById('p-company').value;
  const wc = parseInt(document.getElementById('p-wc').value);
  const cpw = parseInt(document.getElementById('p-cpw').value);
  const dt = document.getElementById('p-date').value;

  if(!comp || !wc) { alert("Lütfen gerekli alanları doldurun!"); return; }

  const newProj = { id: Date.now(), company: comp, wellCount: wc, cement: cpw, date: dt };
  projects.push(newProj);
  
  refreshAll();
  alert("Proje Başarıyla Kaydedildi.");
  // Formu temizle
  document.getElementById('p-company').value = "";
  document.getElementById('p-wc').value = "";
}

// GUNLUK KAYIT EKLEME
function addDailyRecord() {
  const pid = parseInt(document.getElementById('d-project').value);
  const w = parseInt(document.getElementById('d-wells').value);
  const d = document.getElementById('d-wells-date').value;

  if(!pid || !w) return;

  dailyRecords.push({ id: Date.now(), projectId: pid, wells: w, wellsDate: d });
  refreshAll();
  alert("Kuyu Kaydı Alındı.");
  document.getElementById('d-wells').value = "";
}

function renderDashboard() {
  let total = projects.reduce((s,p) => s + p.wellCount, 0);
  let done = dailyRecords.reduce((s,r) => s + r.wells, 0);
  
  document.getElementById('d-total').textContent = total;
  document.getElementById('d-comp').textContent = done;
  document.getElementById('d-rem').textContent = total - done;

  const list = document.getElementById('d-proj-list');
  list.innerHTML = projects.map(p => {
    let pDone = dailyRecords.filter(r => r.projectId === p.id).reduce((s,r) => s + r.wells, 0);
    return `<div class="drow"><div class="drname">${p.company}<span>Hedef: ${p.wellCount} | Biten: ${pDone}</span></div><div style="font-weight:800; color:var(--blue)">%${Math.round((pDone/p.wellCount)*100) || 0}</div></div>`;
  }).join('');
}

function populateDropdown() {
  const sel = document.getElementById('d-project');
  if(!sel) return;
  sel.innerHTML = projects.map(p => `<option value="${p.id}">${p.company}</option>`).join('');
}

function renderProjectList() {
  const pnl = document.getElementById('project-list-panel');
  if(!pnl) return;
  pnl.innerHTML = projects.map(p => `<div class="drow"><div class="drname">${p.company}</div><button onclick="deleteProj(${p.id})" style="background:none; border:none; color:var(--red); font-size:12px;">SİL</button></div>`).join('');
}

function deleteProj(id) {
  if(confirm("Bu projeyi ve tüm kayıtlarını silmek istediğinize emin misiniz?")) {
    projects = projects.filter(p => p.id !== id);
    dailyRecords = dailyRecords.filter(r => r.projectId !== id);
    refreshAll();
  }
}

// ADMIN GIRISI
function openAuthModal() { document.getElementById('authModal').classList.add('open'); }
function closeAuthModal() { document.getElementById('authModal').classList.remove('open'); }
function checkAuth() {
  if(document.getElementById('authInput').value === "1234") {
    isAdmin = true;
    localStorage.setItem('dsm_admin', '1');
    applyAdminUI();
    closeAuthModal();
  } else { alert("Hatalı Şifre!"); }
}
function applyAdminUI() {
  document.querySelectorAll('.admin-only').forEach(el => el.style.display = isAdmin ? 'flex' : 'none');
  document.getElementById('lockBtn').textContent = isAdmin ? '🔓' : '🔒';
}
function logoTap() {
  window.tapCount = (window.tapCount || 0) + 1;
  if(window.tapCount > 4) { isAdmin = false; localStorage.removeItem('dsm_admin'); location.reload(); }
  setTimeout(() => window.tapCount = 0, 2000);
}
</script>
</body>
</html>
